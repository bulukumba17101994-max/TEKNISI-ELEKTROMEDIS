<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1022"/>
    </linearGradient>

    <!-- Glowing Cyan/Teal Gradient (Electromedical Tech) -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Red/Maroon Gradient (RSUD Siwa) -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Hologram Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Futuristic Corner Accents -->
  <path d="M 80 48 L 48 48 L 48 80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 432 48 L 464 48 L 464 80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 48 432 L 48 464 L 80 464" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 464 432 L 464 464 L 432 464" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- High-Tech Circuit Traces -->
  <g stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M 90 256 L 140 256 L 160 220 L 190 220"/>
    <circle cx="90" cy="256" r="4" fill="#38bdf8"/>
    <circle cx="190" cy="220" r="4" fill="#38bdf8"/>

    <path d="M 422 256 L 372 256 L 352 292 L 322 292"/>
    <circle cx="422" cy="256" r="4" fill="#38bdf8"/>
    <circle cx="322" cy="292" r="4" fill="#38bdf8"/>

    <path d="M 256 90 L 256 140 L 292 160 L 292 185"/>
    <circle cx="256" cy="90" r="4" fill="#38bdf8"/>

    <path d="M 256 422 L 256 372 L 220 352 L 220 327"/>
    <circle cx="256" cy="422" r="4" fill="#38bdf8"/>
  </g>

  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-dasharray="16 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="145" fill="#030712" fill-opacity="0.75" stroke="#334155" stroke-width="2"/>

  <!-- Medical Cross Geometry (Electromedical Chassis) -->
  <g filter="url(#glowFilter)">
    <!-- Vertical Cross Bar -->
    <rect x="220" y="140" width="72" height="232" rx="16" fill="url(#redGlow)" stroke="#fecdd3" stroke-width="2" stroke-opacity="0.8"/>
    <!-- Horizontal Cross Bar -->
    <rect x="140" y="220" width="232" height="72" rx="16" fill="url(#redGlow)" stroke="#fecdd3" stroke-width="2" stroke-opacity="0.8"/>
  </g>

  <!-- High-Tech Center Core / Microchip -->
  <rect x="216" y="216" width="80" height="80" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glowFilter)"/>
  
  <!-- ECG Heartbeat Vital Waveform (Neon Cyan Pulse) -->
  <path d="M 110 256 L 195 256 L 215 228 L 235 292 L 256 188 L 277 324 L 297 256 L 317 256 L 330 240 L 342 256 L 402 256"
        fill="none"
        stroke="#38bdf8"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#strongGlow)"/>

  <path d="M 110 256 L 195 256 L 215 228 L 235 292 L 256 188 L 277 324 L 297 256 L 317 256 L 330 240 L 342 256 L 402 256"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Pulse Core Node -->
  <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#strongGlow)"/>
  <circle cx="256" cy="256" r="4" fill="#0284c7"/>

  <!-- Sensor Nodes -->
  <circle cx="215" cy="228" r="4" fill="#38bdf8"/>
  <circle cx="235" cy="292" r="4" fill="#38bdf8"/>
  <circle cx="277" cy="324" r="4" fill="#38bdf8"/>

  <!-- Futuristic Subtle Badge Typography (Curved or Clean) -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#38bdf8">ELEKTROMEDIS</text>
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#cbd5e1">UPTD RSUD SIWA</text>
</svg>
